<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vietnam H3 Grid</title>

    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
</head>

<style>
    html,
    body,
    #map {
        width: 100%;
        height: 100%;
        margin: 0;
    }
</style>


<body>
    <div id="map"></div>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <script type="module">
        import { polygonToCells, cellToBoundary, cellToLatLng } from "https://cdn.jsdelivr.net/npm/h3-js@4.1.0/+esm";
        const map = new maplibregl.Map({
            container: "map",

            style: "https://tiles.openfreemap.org/styles/dark",
            center: [108.2, 16.2],
            zoom: 5
        });

        map.on("load", async () => {
            const response = await fetch("./gadm41_VNM_0.json");
            const vietnamGeoJSON = await response.json();

            const geometry = vietnamGeoJSON.features[0].geometry;

            console.log("Geometry type:", geometry.type);

            const resolution = 5;

            let h3Cells = [];
            if (geometry.type === "Polygon") {
                h3Cells = polygonToCells(
                    convertPolygonToH3Format(geometry.coordinates),
                    resolution
                );
            }

            if (geometry.type === "MultiPolygon") {
                geometry.coordinates.forEach((polygon) => {
                    const cells = polygonToCells(
                        convertPolygonToH3Format(polygon),
                        resolution
                    );
                    h3Cells.push(...cells);
                });
            }

            h3Cells = [...new Set(h3Cells)];
            console.log("Số H3 cells:", h3Cells.length)

            // Lấy tâm của từng ô H3 để truy vấn nhiệt độ.
            const centers = h3Cells.map((cell) => {
                const [lat, lng] = cellToLatLng(cell);

                return { cell, lat, lng };
            });

            // Gom nhiều tâm H3 vào một request để tránh gọi 1 API / 1 ô.
            const BATCH_SIZE = 10;
            const temperatureByCell = new Map();

            for (let i = 0; i < centers.length; i += BATCH_SIZE) {
                const batch = centers.slice(i, i + BATCH_SIZE);

                const latitudes = batch.map((p) => p.lat).join(",");
                const longitudes = batch.map((p) => p.lng).join(",");

                const weatherUrl =
                    "https://api.open-meteo.com/v1/forecast" +
                    `?latitude=${encodeURIComponent(latitudes)}` +
                    `&longitude=${encodeURIComponent(longitudes)}` +
                    "&current=temperature_2m";

                try {
                    const weatherResponse = await fetch(weatherUrl);

                    if (!weatherResponse.ok) {
                        throw new Error(`Open-Meteo HTTP ${weatherResponse.status}`);
                    }

                    const weatherData = await weatherResponse.json();
                    const results = Array.isArray(weatherData) ? weatherData : [weatherData];

                    batch.forEach((point, index) => {
                        const temperature = results[index]?.current?.temperature_2m;
                        temperatureByCell.set(
                            point.cell,
                            Number.isFinite(temperature) ? temperature : null
                        );
                    });
                } catch (error) {
                    console.error("Lỗi lấy dữ liệu Open-Meteo:", error);
                    batch.forEach((point) => temperatureByCell.set(point.cell, null));
                }
            }

            const h3Features = h3Cells.map((cell) => {
                const boundary = cellToBoundary(cell);

                const coordinates = boundary.map(([lat, lng]) => [
                    lng,
                    lat
                ]);

                // đóng polygon
                coordinates.push(coordinates[0]);

                const [centerLat, centerLng] = cellToLatLng(cell);

                return {
                    type: "Feature",

                    properties: {
                        h3: cell,
                        temperature: temperatureByCell.get(cell),
                        center_lat: centerLat,
                        center_lng: centerLng
                    },

                    geometry: {
                        type: "Polygon",
                        coordinates: [coordinates]
                    }
                };
            });

            const h3GeoJSON = {
                type: "FeatureCollection",
                features: h3Features
            };

            // 4. Add source H3
            map.addSource("h3-grid", {
                type: "geojson",
                data: h3GeoJSON
            });

            // Tô các ô H3 bằng màu xanh nhạt cố định
            map.addLayer({
                id: "h3-fill",
                type: "fill",
                source: "h3-grid",

                paint: {
                    "fill-color": [
                        "case",
                        ["==", ["get", "temperature"], null],
                        "#555555",
                        [
                            "interpolate",
                            ["linear"],
                            ["get", "temperature"],
                            10, "#313695",
                            15, "#4575b4",
                            20, "#74add1",
                            25, "#abd9e9",
                            28, "#ffffbf",
                            30, "#fdae61",
                            33, "#f46d43",
                            36, "#d73027",
                            40, "#a50026"
                        ]
                    ],
                    "fill-opacity": 0.72
                }
            });

            // Vẽ đường viền các ô H3
            map.addLayer({
                id: "h3-border",
                type: "line",
                source: "h3-grid",

                paint: {
                    "line-color": "#ffffff",
                    "line-width": 0.5,
                    "line-opacity": 0.7
                }
            });

            // Add viền Việt Nam
            map.addSource("vietnam-boundary", {
                type: "geojson",
                data: vietnamGeoJSON
            });

            // Vẽ đường viền Việt Nam
            map.addLayer({
                id: "vietnam-border",
                type: "line",
                source: "vietnam-boundary",

                paint: {
                    "line-color": "#03ff63",
                    "line-width": 2
                }
            });

            map.on("click", "h3-fill", (e) => {
                const feature = e.features?.[0];
                if (!feature) return;

                const props = feature.properties;
                const temperature = Number(props.temperature);
                const temperatureText = Number.isFinite(temperature)
                    ? `${temperature.toFixed(1)} °C`
                    : "Không có dữ liệu";

                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`
                        <strong>H3:</strong> ${props.h3}<br>
                        <strong>Nhiệt độ:</strong> ${temperatureText}<br>
                        <strong>Tâm ô:</strong>
                        ${Number(props.center_lat).toFixed(5)},
                        ${Number(props.center_lng).toFixed(5)}
                    `)
                    .addTo(map);
            });

            map.on("mouseenter", "h3-fill", () => {
                map.getCanvas().style.cursor = "pointer";
            });

            map.on("mouseleave", "h3-fill", () => {
                map.getCanvas().style.cursor = "";
            });

        });

        function convertPolygonToH3Format(coordinates) {
            /*
              GeoJSON:
              [lng, lat]
      
              H3 polygonToCells:
              [lat, lng]
            */

            return coordinates.map((ring) =>
                ring.map(([lng, lat]) => [
                    lat,
                    lng
                ])
            );
        }

        function createOutsideMask(geometry) {
            const worldRing = [
                [-180, -85],
                [180, -85],
                [180, 85],
                [-180, 85],
                [-180, -85]
            ];

            const polygons = geometry.type === "MultiPolygon"
                ? geometry.coordinates
                : [geometry.coordinates];

            // Các polygon lãnh thổ trở thành lỗ rỗng trong lớp phủ thế giới.
            const vietnamOuterRings = polygons.map((polygon) =>
                ensureClockwise(polygon[0])
            );

            return {
                type: "Feature",
                properties: {},
                geometry: {
                    type: "Polygon",
                    coordinates: [worldRing, ...vietnamOuterRings]
                }
            };
        }

        function ensureClockwise(ring) {
            let signedArea = 0;

            for (let i = 0; i < ring.length - 1; i++) {
                signedArea += ring[i][0] * ring[i + 1][1]
                    - ring[i + 1][0] * ring[i][1];
            }

            return signedArea > 0 ? [...ring].reverse() : ring;
        }
    </script>
</body>

</html>
